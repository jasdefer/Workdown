# Workdown's own schema — this repo dogfoods the tool on itself.
# Deliberately minimal: an item is a title, a status, and its place in the
# graph. Scheduling (dates, durations, effort estimates) was removed — the
# calendar was maintained by hand and read by no one, and the date and
# duration machinery is covered by the crate's own tests instead.
#
# Not the shipped default; that lives in crates/core/defaults/schema.yaml
# and still demonstrates the full type system.

fields:
  id:
    type: string
    required: true
    default: $filename
    description: Unique identifier. Defaults to filename without .md extension.

  title:
    type: string
    required: true
    default: $filename_pretty
    description: Display name. Falls back to prettified filename if not set.

  # `on_hold` is parked work: started or specified, deliberately not being
  # picked up until a trigger named in the item fires. It keeps parked
  # items apart from ready ones on the board, which `to_do` alone cannot.
  status:
    type: choice
    values: [to_do, in_progress, on_hold, done, removed]
    required: true
    default: to_do

  # Free-form labels. Carries the occasional distinction that used to be a
  # `type` choice (a bug, say) without putting a field on every item.
  tags:
    type: list
    required: false

  # Relations
  parent:
    type: link
    required: false
    allow_cycles: false
    inverse: children

  depends_on:
    type: links
    required: false
    allow_cycles: false
    inverse: dependents

  # Derived by condition (first match wins) — dogfoods
  # conditional-field-value. A hand-written color on an item always wins.
  color:
    type: color
    required: false
    when:
      - if: status == "done"
        then: green
      - if: status == "removed"
        then: gray
      - if: status == "in_progress"
        then: blue
      - if: status == "on_hold"
        then: yellow
    default: gray

# ── Rules ──────────────────────────────────────────────────
# Cross-field, cross-item, and collection-wide validation.
# See schema.schema.json for the formal rule syntax definition.
#
# A parent's status must agree with its children's. These match on
# `children.status` alone, so they apply to any item that has children —
# no field has to declare an item a "milestone" for them to hold.
#
# Each match needs an `any` guard as well as its `all`: `all` over an empty
# set is vacuously true, so without it a childless leaf would match and be
# required to take the parent status.
#
# The mixed case — some children finished, the rest unstarted, nothing
# running — cannot be matched by one rule (it would need two `any` clauses
# on the same field). The two range rules at the end close it together:
# an unstarted child means the parent is not done, a finished child means
# it is no longer merely to do, and only `in_progress` or `on_hold`
# satisfies both.
#
# `on_hold` flows upward only: a child on hold lets its parent pause, but
# a child in progress pins the parent to in progress — work is happening
# under it, whatever the label says.
rules:
  - name: parent-in-progress-when-child-in-progress
    match:
      children.status:
        any: in_progress
    require:
      status:
        values: [in_progress]
  - name: parent-active-when-child-on-hold
    match:
      children.status:
        any: on_hold
        none: in_progress
    require:
      status:
        values: [in_progress, on_hold]
  - name: parent-to-do-when-all-children-to-do
    match:
      children.status:
        all: to_do
        any: to_do
    require:
      status:
        values: [to_do]
  - name: parent-done-when-all-children-done-or-removed
    match:
      children.status:
        all: [done, removed]
        any: [done, removed]
    require:
      status:
        values: [done]
  - name: unstarted-child-keeps-parent-open
    match:
      children.status:
        any: to_do
    require:
      status:
        values: [to_do, in_progress, on_hold]
  - name: finished-child-starts-parent
    match:
      children.status:
        any: done
        none: in_progress
    require:
      status:
        values: [in_progress, on_hold, done]
