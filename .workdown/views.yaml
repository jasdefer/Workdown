views:
- id: status-board
  type: board
  field: status
- id: hierarchy
  type: tree
  display:
    fields:
    - status
  field: parent
- id: dependencies
  type: graph
  where:
  - status not in done,removed
  field: depends_on
  group_by: parent
- id: items
  type: table
  display:
    fields:
    - id
    - status
    - parent
    - depends_on
- id: items-by-status
  type: bar_chart
  where:
  - status!=removed
  group_by: status
  aggregate: count
- id: project-stats
  type: metric
  where:
  - status!=removed
  metrics:
  - label: Total items
    aggregate: count
  - label: To do
    aggregate: count
    where:
    - status=to_do
  - label: In progress
    aggregate: count
    where:
    - status=in_progress
  - label: Done
    aggregate: count
    where:
    - status=done
