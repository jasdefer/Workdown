name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned in rust-toolchain.toml (dtolnay@stable
      # would override the pin with latest stable). Cache is disabled in
      # favour of Swatinem/rust-cache below.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # Build the UI bundle before any Rust step: the non-test
      # `UiAssets` rust-embed derive requires `ui/dist/` to exist at
      # compile time, so clippy/build/doc would fail without it.
      # Captured to a log because the completeness check below reads the
      # Vitest summary out of it. `shell: bash` gives `pipefail`, so a
      # failing build still fails this step despite the `tee`.
      - name: Build UI bundle
        shell: bash
        run: cargo xtask build-ui 2>&1 | tee build-ui.log

      - name: Check formatting
        run: cargo fmt --check

      # --all-targets so test code is linted too — without it, warnings
      # in #[cfg(test)] modules and tests/ accumulate invisibly.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --workspace on build and test: `default-members` scopes bare cargo
      # commands to the CLI crate (a `cargo run` convenience), which would
      # silently skip every core and server test here.
      - name: Build
        run: cargo build --workspace

      - name: Test
        shell: bash
        run: cargo test --workspace 2>&1 | tee cargo-test.log

      # A green `cargo test` only says that what ran passed. This step
      # derives every test target from the tree (one unit binary per
      # crate, every `crates/*/tests/*.rs`) and fails by name when one is
      # missing from the log above, and checks the Vitest run happened.
      - name: Check every test target ran
        run: .github/scripts/check-test-run.sh cargo-test.log build-ui.log

      - name: Doc
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

      # UI bundle is already built above; just exercise the release
      # compile so we catch `--release`-only breakage.
      - name: Release build
        run: cargo build --release --workspace

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
