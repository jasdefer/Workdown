[package]
name = "workdown-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Workdown domain library — model, parser, store, query, rules, operations"
publish = false

[dependencies]
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror = "2"
tracing.workspace = true
regex = "1"
walkdir = "2"
csv.workspace = true
uuid = { version = "1", features = ["v4"] }
chrono = { workspace = true, features = ["clock", "serde"] }
# `no-serde-warnings`: DisplayConfig pairs `skip_serializing_if` (for
# clean views.yaml output) with an explicit `#[ts(optional)]` — the TS
# side is hand-annotated, so ts-rs's "can't parse this serde attribute"
# warning is pure noise on every build.
ts-rs = { version = "10", features = ["serde-compat", "chrono-impl", "no-serde-warnings"] }
# The variant lists the drift guards compare against (`ViewType`,
# `FieldType`, `FieldProperty`). Deriving them from the enum definition
# is the point: a hand-written `ALL` const would be one more copy of the
# fact the guards exist to protect.
strum = { version = "0.28", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
