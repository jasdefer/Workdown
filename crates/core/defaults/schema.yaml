# Default Workdown Schema — copied into your project by `workdown init`.
# Field types and their options, derived fields (aggregate, compute, when,
# pull) and rules are explained with copy-pasteable examples in the schema
# guide: https://github.com/jasdefer/Workdown/blob/main/docs/schema.md

fields:
  id:
    type: string
    required: false
    default: $filename
    description: Unique identifier. Defaults to filename without .md extension.

  title:
    type: string
    required: false
    default: $filename_pretty
    description: Display name. Falls back to prettified filename if not set.

  type:
    type: choice
    values: [epic, task, bug, spike]
    required: true
    default: task

  status:
    type: choice
    values: [backlog, open, in_progress, review, done, closed]
    required: true
    default: backlog

  priority:
    type: choice
    values: [critical, high, medium, low]
    required: false

  assignee:
    type: string
    required: false
    resource: people

  tags:
    type: list
    required: false

  created:
    type: date
    required: true
    default: $today

  updated:
    type: date
    required: false

  status_color:
    type: color
    description: Derived from status by the first matching branch; a color set by hand on an item wins. Tints cards and bars through the display color role in config.yaml.
    when:
      - if: status == "done"
        then: green
      - if: status == "in_progress"
        then: blue
      - if: status == "review"
        then: purple
      - if: status == "closed"
        then: gray
    default: gray

  parent:
    type: link
    required: false
    allow_cycles: false
    inverse: children

  depends_on:
    type: links
    required: false
    allow_cycles: false
    inverse: dependents

  related_to:
    type: links
    required: false
    allow_cycles: true
    inverse: related_items

  duplicates:
    type: links
    required: false
    allow_cycles: true
    inverse: duplicated_by

rules:
  - name: in-progress-needs-assignee
    description: Work items in progress must have an assignee
    match:
      status: in_progress
    require:
      assignee: required

  - name: bugs-need-priority
    description: Bugs must have a priority set
    match:
      type: bug
    require:
      priority: required
