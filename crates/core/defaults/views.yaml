# Default Workdown Views — copied into your project by `workdown init`.
# Each entry is a persisted view rendered by `workdown render`.
# Customize `field` values to fit your schema.
# See views.schema.json for the formal structure.

views:
  - id: status-board
    type: board
    field: status

  - id: hierarchy
    type: tree
    field: parent

  - id: dependencies
    type: graph
    # The inverse name of `depends_on`: arrows follow the order of work,
    # from an item to the items that wait for it. `field: depends_on`
    # draws the same links the other way round.
    field: dependents
